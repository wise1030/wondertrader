# ============================================================
# Strategy Coordinator Configuration — 模块开关 + 模块参数
# ------------------------------------------------------------
# 本文件是模块开关的【唯一权威位置】, config.yaml 不再承载任何开关,
# 避免多源错配。
#
#   策略级开关 (写在 coordinator 根级):
#     useMarketMaking / useSpreadArbitrage / useAsyncArbThread
#     usePerformanceMonitor / usePerformanceAnalyzer
#     use_signal_aggregator / useHedging
#
#   模块级开关 (写在 modules.<name>.enabled):
#     toxicityDetector / spreadOptimizer / adaptiveParam / selfTradePrevention
#
# 找不到键时使用编译期默认值(见 UftFutuMmStrategy.h::Modules 构造函数),
# 不构成"第二处配置", 仅为代码内 fallback.
# ============================================================
coordinator:
  # === 策略级开关 (唯一权威位置 — 根级书写) ===
  useMarketMaking: true
  useSpreadArbitrage: true
  useAsyncArbThread: true          # 实盘=true(独立arb线程, 低延迟), 回测=false(主线程同步)
  usePerformanceMonitor: false
  usePerformanceAnalyzer: false
  use_signal_aggregator: true
  useHedging: false                # 对冲默认关闭(由 Delta skew 自然消耗)

  # --- 对冲参数 (useHedging=true 时生效) ---
  hedgeDeltaThreshold: 0.8
  hedgeCooldownMs: 5000

  # --- 流水线参数 ---
  pipeline:
    paramUpdateInterval: 100      # 自适应参数更新间隔(tick), 不可配 0
    alphaSensitivity: 2.0         # Alpha 灵敏度(冷启动保护用)

  # ============================================================
  # 模块参数 (modules 节点)
  # ============================================================
  modules:

    # --- 信号聚合器 (6 源 + 三层权重) ---
    signalAggregator:
      useVolatility: true
      useOfi: true
      useTradeFlow: true
      useBookImbalance: true
      useMomentum: true
      useLeadLag: true
      # 窗口参数
      volatilityWindow: 100
      ofiWindow: 50
      tradeFlowWindow: 100
      largeTradeThreshold: 50.0
      bookImbalanceThreshold: 0.2
      momentumWindow: 50
      momentumEmaAlpha: 0.1
      leadLagWindow: 50
      leadLagLagMs: 50
      warmupTicks: 20
      volThreshold: 0.003
      # 基础权重 (Layer 1, 可被 regime/IC 动态调节)
      ofiWeight: 0.35
      tradeWeight: 0.25
      bookImbalanceWeight: 0.20
      momentumWeight: 0.15
      leadLagWeight: 0.05
      strongThreshold: 0.7

    # --- 毒性检测器 (VPIN + OFI + 自成交校准) ---
    toxicityDetector:
      enabled: true                # 模块级开关 (唯一位置: modules.<name>.enabled)
      adverseThreshold: 0.25       # 综合毒性触发阈值
      vpinThreshold: 0.30          # VPIN 单独触发阈值
      window: 20                   # VPIN 桶大小
      bucketSize: 50
      cooloffMs: 5000              # 毒性冷却期
      alphaWeight: 0.5             # alpha 通道权重
      extremeThreshold: 0.6        # extreme 信号阈值

    # --- GLFT 价差优化器 ---
    # 注意: baseSpread 不在此配置 — 它从 config.yaml 的 quoting.baseSpread 加载
    #       (FutuComponentFactory::createSpreadOptimizer 用参数传入 GLFTParams, 不读本节点)
    spreadOptimizer:
      enabled: true                # 模块级开关 (唯一位置)
      phi: 0.20                    # 库存厌恶系数
      deltaSkewThreshold: 0.3      # Delta 偏斜触发
      deltaSkewFactor: 1.5         # 偏斜强度
      deltaSkewPower: 1.5
      maxSpreadMult: 3.0           # 最大价差乘子
      minSpreadMult: 1.0           # 最小价差乘子
      confidenceWeightMin: 0.3
      confidenceWeightMax: 1.0
      depthSensitivity: 0.5
      toxicitySpreadFactor: 1.0
      lowConfidenceSpreadFactor: 2.0

    # --- 自成交校准器 ---
    selfTradeCalibrator:
      toxicityWindowMs: 5000
      adverseThreshold: 0.6

    # --- 自适应参数 (当前为占位, 未启用) ---
    adaptiveParam:
      enabled: false               # 模块级开关 (唯一位置)

