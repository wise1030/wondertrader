# ============================================================
# 运行时热更新参数 (共享内存同步)
# ------------------------------------------------------------
# 修改后无需重启策略, 通过 on_params_updated() 回调实时生效。
# 键名必须用 snake_case (与 FutuHotParamManager::registerParams 中
# sync_param 注册名完全一致), 否则共享内存写入不生效。
# 注意: 报价参数(base_spread/base_qty/level_qty_multiplier/level_step/max_delta)会
# 穿透到 FutuQuoter 和 Coordinator; 信号权重穿透到 AdaptiveWeightFramework。
# ============================================================

# --- 报价基础参数 ---
base_spread: 2.0
base_qty: 10.0
level_qty_multiplier: 0.7
level_step: 1.0

# --- 组合参数 ---
# max_delta = 组合级 delta 软限: 组合 skew 归一化基准 + RiskCoordinator 软响应
# (WIDEN_SPREAD) 阈值分母; 原始 delta 口径 (|totalDelta|/max_delta), 非风控硬顶
max_delta: 30

# --- Alpha 灵敏度 ---
alpha_sensitivity: 2.0

# --- 信号权重 (Layer 1 基础权重, 经 regime×IC 三层调节) ---
ofi_weight: 0.35
trade_weight: 0.25
book_imbalance_weight: 0.20
momentum_weight: 0.15
lead_lag_weight: 0.05
strong_threshold: 0.7

# --- GLFT 价差模型参数 ---
confidence_weight_min: 0.3
confidence_weight_max: 1.0
phi: 0.20
delta_skew_threshold: 0.3
delta_skew_factor: 1.5
max_spread_mult: 3.0
min_spread_mult: 1.0
depth_sensitivity: 0.5
toxicity_spread_factor: 1.0
low_confidence_spread_factor: 2.0

# --- 报价粘性/保护参数 ---
sticky_threshold: 1.0
improve_retreat_ratio: 2.0
protect_ticks: 1.0
max_price_deviation: 20.0

# --- B2(2026-08-24②): 单合约 delta 软限 (应用于全部合约; 合约间差异化配置需重启) ---
contract_max_delta: 30
