   		<p>　这是您第一次使用快期交易终端V2版，与您原来熟悉的快期V1版相比，主要有以下差异：</p>
		<ul>
			<li>按【F1】切换到报价，按【F2】切换到挂单，按【F3】切换到持仓，按【F4】切换到成交</li>
			<li>在下单板上修改价格时只需输入最后几位</li>
			<li>在界面顶部实时显示资金概要，需要详细资金情况可以点【主菜单】-【系统】-【查期货账户资金】</li>
			<li>各页面数据都是实时数据，不需要人工刷新</li>
		</ul>
